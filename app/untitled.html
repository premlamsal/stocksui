<!DOCTYPE html>
<html>
  <head>
    <title>Responsive Table</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      
      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 10px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
        overflow-x: auto;
        white-space: nowrap;
      }
      
      th, td {
        text-align: left;
        padding: 10px;
      }
      
      th {
        background-color: #00a1e4;
        color: white;
      }
      
      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
      
      @media (max-width: 767px) {
        table {
          font-size: 14px;
        }
      }
      
      @media (max-width: 479px) {
        table {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Invoice ID</th>
            <th>Date</th>
            <th>Customer Name</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1001</td>
            <td>2022-03-15</td>
            <td>John Doe</td>
            <td>$100.00</td>
          </tr>
          <tr>
            <td>1002</td>
            <td>2022-03-16</td>
            <td>Jane Doe</td>
            <td>$150.00</td>
          </tr>
          <tr>
            <td>1003</td>
            <td>2022-03-17</td>
            <td>Mike Smith</td>
            <td>$200.00</td>
          </tr>
          <tr>
            <td>1004</td>
            <td>2022-03-18</td>
            <td>Sarah Johnson</td>
            <td>$50.00</td>
          </tr>
          <tr>
            <td>1005</td>
            <td>2022-03-19</td>
            <td>Tom Brown</td>
            <td>$75.00</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
